steps:
  - uses: actions/checkout@v4  # Checkout code
 
  - uses: actions/setup-node@v4
    with:
      node-version: '20'  # Setup Node.js
 
  - name: Install dependencies
    run: npm install  # Run shell command
 
  - name: Run tests
    run: npm test
 
  - uses: actions/upload-artifact@v4
    with:
      name: test-results
      path: coverage/
