    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build
        run: echo "Building..." 
  test:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test
        run: echo "Testing..." 
  deploy:
